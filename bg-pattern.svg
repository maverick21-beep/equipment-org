<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#f2650f" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#f2650f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f2650f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSide" cx="100%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="1000" fill="#0a0b10"/>
  <rect width="1600" height="1000" fill="url(#glowTop)"/>
  <rect width="1600" height="1000" fill="url(#glowSide)"/>

  <!-- running track -->
  <g stroke="#f2650f" stroke-opacity="0.14" fill="none" stroke-width="3">
    <ellipse cx="800" cy="560" rx="680" ry="270"/>
    <ellipse cx="800" cy="560" rx="560" ry="200"/>
    <ellipse cx="800" cy="560" rx="440" ry="130"/>
  </g>

  <!-- basketball court diagram, upper left -->
  <g stroke="#8b91a5" stroke-opacity="0.13" fill="none" stroke-width="2.5">
    <rect x="80" y="90" width="360" height="230" rx="4"/>
    <circle cx="260" cy="205" r="58"/>
    <line x1="80" y1="205" x2="440" y2="205"/>
    <path d="M80 150 A55 55 0 0 1 80 260"/>
  </g>

  <!-- heartbeat / pulse line -->
  <polyline points="60,760 260,760 300,700 340,830 380,690 420,760 1540,760"
    fill="none" stroke="#f2650f" stroke-opacity="0.20" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- basketball, upper right, faint -->
  <g stroke="#ffffff" stroke-opacity="0.10" fill="none" stroke-width="2.5">
    <circle cx="1360" cy="180" r="130"/>
    <path d="M1230 180 c70 26 140 26 260 0"/>
    <path d="M1220 240 c80 -26 160 -26 280 0"/>
    <path d="M1360 50 c-26 80 -26 180 0 260"/>
  </g>

  <!-- dumbbell, lower right -->
  <g stroke="#4f8cff" stroke-opacity="0.14" fill="none" stroke-width="4" stroke-linecap="round">
    <line x1="1220" y1="880" x2="1430" y2="880"/>
    <rect x="1190" y="850" width="40" height="60" rx="8"/>
    <rect x="1420" y="850" width="40" height="60" rx="8"/>
    <rect x="1160" y="862" width="20" height="36" rx="6"/>
    <rect x="1460" y="862" width="20" height="36" rx="6"/>
  </g>

  <!-- stopwatch, mid right -->
  <g stroke="#eab308" stroke-opacity="0.13" fill="none" stroke-width="2.5">
    <circle cx="1470" cy="520" r="70"/>
    <line x1="1470" y1="450" x2="1470" y2="430"/>
    <line x1="1445" y1="410" x2="1460" y2="425"/>
    <line x1="1470" y1="520" x2="1470" y2="475"/>
    <line x1="1470" y1="520" x2="1500" y2="520"/>
  </g>

  <!-- soccer ball, lower left -->
  <g stroke="#ffffff" stroke-opacity="0.10" fill="none" stroke-width="2.2">
    <circle cx="180" cy="860" r="90"/>
    <path d="M140 830 l40 -18 40 18 8 44 -44 26 -44 -26 8 -44Z"/>
    <line x1="180" y1="770" x2="180" y2="800"/>
    <line x1="95" y1="830" x2="122" y2="838"/>
    <line x1="265" y1="830" x2="238" y2="838"/>
  </g>

  <!-- scattered dot-grid accents (brand motif) -->
  <g fill="#f2650f" fill-opacity="0.14">
    <circle cx="640" cy="130" r="3"/>
    <circle cx="660" cy="130" r="3"/>
    <circle cx="640" cy="150" r="3"/>
    <circle cx="660" cy="150" r="3"/>

    <circle cx="980" cy="900" r="3"/>
    <circle cx="1000" cy="900" r="3"/>
    <circle cx="980" cy="920" r="3"/>
    <circle cx="1000" cy="920" r="3"/>
  </g>
</svg>
